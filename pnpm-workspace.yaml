packages:
  - "packages/*"
  - "examples/*"
  - "e2e"
# pnpm 12 applies a supply-chain release-age gate by default. Every entry below names
# one exact version allowed through it, so an entry dies with its version instead of
# exempting a package forever. Keep it that way: no bare package names except the
# first-party '@bigmi/*' and '@lifi/*' wildcards.
#
# pnpm rewrites this sequence on install and drops comments placed between the items,
# so the rationale has to live here, above the key:
#   - wagmi 3.7.7 carries @wagmi/core 3.6.5, which drops the viem tempo/zones import.
#     Kept so a gate cannot hold the tree below that line; these have since aged out.
#   - The 2026-10-07 dependency bump took the Dynamic SDK 5.9.6 set, Next.js 16.4.0,
#     knip 6.40.0 and Svelte 5.57.2 deliberately while they were still inside the
#     age window.
#   - '@next/swc-*' and the other platform binaries are added by pnpm itself to
#     match the package that pulls them.
minimumReleaseAgeExclude:
  - '@bigmi/*'
  - '@lifi/*'
  - wagmi@3.7.7
  - '@wagmi/core@3.6.5'
  - '@wagmi/connectors@8.2.0'
  - '@dynamic-labs/assert-package-version@5.9.6'
  - '@dynamic-labs/bitcoin@5.9.6'
  - '@dynamic-labs/embedded-wallet-solana@5.9.6'
  - '@dynamic-labs/embedded-wallet@5.9.6'
  - '@dynamic-labs/ethereum-aa-core@5.9.6'
  - '@dynamic-labs/ethereum-aa@5.9.6'
  - '@dynamic-labs/ethereum-core@5.9.6'
  - '@dynamic-labs/ethereum-gasless-core@5.9.6'
  - '@dynamic-labs/ethereum@5.9.6'
  - '@dynamic-labs/iconic@5.9.6'
  - '@dynamic-labs/locale@5.9.6'
  - '@dynamic-labs/logger@5.9.6'
  - '@dynamic-labs/multi-wallet@5.9.6'
  - '@dynamic-labs/rpc-providers@5.9.6'
  - '@dynamic-labs/sdk-react-core@5.9.6'
  - '@dynamic-labs/solana-core@5.9.6'
  - '@dynamic-labs/solana@5.9.6'
  - '@dynamic-labs/store@5.9.6'
  - '@dynamic-labs/sui-core@5.9.6'
  - '@dynamic-labs/types@5.9.6'
  - '@dynamic-labs/utils@5.9.6'
  - '@dynamic-labs/waas-evm@5.9.6'
  - '@dynamic-labs/waas-svm@5.9.6'
  - '@dynamic-labs/waas@5.9.6'
  - '@dynamic-labs/wagmi-connector@5.9.6'
  - '@dynamic-labs/wallet-book@5.9.6'
  - '@dynamic-labs/wallet-connect@5.9.6'
  - '@dynamic-labs/wallet-connector-core@5.9.6'
  - '@dynamic-labs/webauthn@5.9.6'
  - '@next/env@16.4.0'
  - '@next/swc-darwin-arm64@16.4.0'
  - '@next/swc-darwin-x64@16.4.0'
  - '@next/swc-linux-arm64-gnu@16.4.0'
  - '@next/swc-linux-arm64-musl@16.4.0'
  - '@next/swc-linux-x64-gnu@16.4.0'
  - '@next/swc-linux-x64-musl@16.4.0'
  - '@next/swc-win32-arm64-msvc@16.4.0'
  - '@next/swc-win32-x64-msvc@16.4.0'
  - knip@6.40.0
  - next@16.4.0
  - svelte@5.57.2
overrides:
  "@react-native-async-storage/async-storage": ">=2.2.0"
  "@reown/appkit": ">=1.8.20"
  "@msgpack/msgpack": ">=3.1.3"
  abitype: ">=1.2.4"
  axios: "^1.20.0"
  viem: ">=2.52.0"
  bs58: ">=4.0.1"
  preact: ">=10.29.1"
  # Held at 0.26.0. 0.28.0 regressed for us; an override (not just the specifier)
  # is what stops the next `pnpm update --latest` from silently taking it again.
  vite-plugin-node-polyfills: "0.26.0"
  # GHSA-f88m-g3jw-g9cj — libvips flaws; next@15 still resolves 0.34.x.
  sharp: ">=0.35.0"
  use-sync-external-store: "1.4.0"
  utf-8-validate: "6.0.6"
  zod: ">=4.4.3"
  "ws@>=7.0.0 <8.0.0": ">=7.5.12"
  "ws@>=8.0.0": ">=8.21.1"
  esbuild: ">=0.25.0"
  "es-toolkit@1": ">=1.52.0"
  # Security (Aikido), 2026-10-12. Each key below has a selector that covers only
  # the advisory's affected range, so copies outside that range do not move.
  # tronweb 6.2.2 and 6.5.1 pin validator 13.15.23 exactly.
  "validator@<13.15.26": ">=13.15.26"
  # WalletConnect family: these packages release together and must move together.
  # 2.23.9 (pinned by @tronweb3/walletconnect-tron 4.0.3), 2.23.7
  # (@reown/appkit-controllers 1.8.24), 2.23.2 (Dynamic), 2.23.0
  # (@creit.tech/stellar-wallets-kit), 2.22.4 (Privy) and 2.21.x (examples) are all
  # inside advisories fixed in 2.23.10. They resolve to 2.25.0, the copy other
  # parents already pin exactly, so the family stays on one version. This replaces
  # the old "@reown/appkit>@walletconnect/universal-provider" rule.
  "@walletconnect/core@<2.23.10": ">=2.23.10"
  "@walletconnect/sign-client@<2.23.10": ">=2.23.10"
  "@walletconnect/utils@<2.23.10": ">=2.23.10"
  "@walletconnect/types@<2.23.10": ">=2.23.10"
  "@walletconnect/universal-provider@<2.23.10": ">=2.23.10"
  "@walletconnect/ethereum-provider@<2.23.10": ">=2.23.10"
  # @walletconnect/logger 3.0.x pins pino 10.0.0 exactly; the fix is 10.1.1.
  "pino@<10.1.1": ">=10.1.1"
  # Forced major. tronweb 6.2.2 and 6.5.1 pin google-protobuf 3.21.4 exactly; no
  # tronweb release fixes it. A TRX and a TRC-20 round trip give the same bytes on 4.x.
  "google-protobuf@<4.0.3": "^4.0.3"
  # Forced major. @metamask/utils (^9.0.1) and @metamask/sdk 0.33.1 (^8.3.2,
  # deprecated) call only uuid.v4() and validate(). uuid 12 and later have no
  # require() export, so 11 is the highest major they can load.
  "uuid@<11.1.1": "^11.1.1"
  # Forced major. Dynamic 5.9.6 (and 5.10.0) pins i18next 23.4.6. It calls only
  # createInstance().use().init(), which i18next 26 keeps.
  "i18next@<26.3.4": "^26.3.4"
  # Forced major. @dynamic-labs-wallet/forward-mpc-shared imports
  # "@noble/ciphers/aes"; 2.x removed that path, so 1.x is the highest usable major.
  "@noble/ciphers@<1.0.0": "^1.3.0"
  # Forced major. Privy (react-auth, js-sdk-core) still declares jose ^4 and uses
  # importJWK, CompactEncrypt and decodeJwt, which jose 6 keeps. Examples only.
  "jose@<6.2.5": "^6.2.5"
  # Forced major. @remix-run/node 2.17.5 declares undici ^6 and loads it only from
  # installGlobals({ nativeFetch: true }). remix-serve passes future.v3_singleFetch,
  # which the Remix example does not set. undici 8 has no File export, so setting
  # v3_singleFetch would need this override to be revisited.
  "undici@<8.10.2": "^8.10.2"
  # Forced major. Nuxt (nitropack, unstorage) accepts ioredis 5; the advisory is in
  # the Cluster client, and this repo uses no Redis. Example only.
  "ioredis@<6.0.0": "^6.0.0"
  # Forced major. simple-git 3.36.0 (Nuxt devtools) depends on argv-parser 1.x;
  # 2.0.1 keeps the vulnerabilityCheck(tokens, env) API.
  "@simple-git/argv-parser@<2.0.1": "^2.0.1"
  # Forced major (unflagged copy). @solana/web3.js (^4.3.0) loads only
  # jayson/lib/client/browser. jayson 5 drops stream-json and uuid 8. Needs Node 20+.
  "jayson@<5.0.0": "^5.0.0"
allowBuilds:
  "@opensea/seaport-js": false
  "@parcel/watcher": false
  "@reown/appkit": false
  "@stellar/stellar-sdk": false
  bigint-buffer: false
  "blake-hash": false
  bufferutil: false
  core-js: false
  esbuild: true
  keccak: false
  msgpackr-extract: false
  nx: true
  protobufjs: false
  "secp256k1": false
  sharp: false
  svelte-preprocess: false
  "tiny-secp256k1": false
  tsl-apple-cloudkit: false
  usb: false
  utf-8-validate: false
