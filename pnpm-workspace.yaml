packages:
  - "packages/*"
  - "examples/*"
  - "e2e"
minimumReleaseAgeExclude:
  - "@bigmi/*"
  - "@lifi/*"
  - "@creit.tech/stellar-wallets-kit@2.6.0"
  - "@dynamic-labs/legacy-client@5.4.0"
  # wagmi 3.7.7 is the release that carries @wagmi/core 3.6.5, which drops the
  # viem tempo/zones import. Excluded because it is younger than the age gate.
  - "wagmi@3.7.7"
  - "@wagmi/core@3.6.5"
  - "@wagmi/connectors@8.2.0"
overrides:
  "@react-native-async-storage/async-storage": ">=2.2.0"
  "@reown/appkit": ">=1.8.20"
  "@reown/appkit>@walletconnect/universal-provider": ">=2.23.9"
  "@msgpack/msgpack": ">=3.1.3"
  abitype: ">=1.2.4"
  axios: "^1.16.0"
  viem: ">=2.52.0"
  bs58: ">=4.0.1"
  # centrifuge asks for protobufjs ^7.6.0, which already clears CVE-2026-41242, so
  # this floor guards nothing. It lifts centrifuge onto 8.x. Kept because that is
  # the tested resolution and removing it moves protobufjs to 7.6.6.
  protobufjs: ">=7.5.5"
  preact: ">=10.29.1"
  # GHSA-f88m-g3jw-g9cj — libvips flaws; next@15 still resolves 0.34.x.
  sharp: ">=0.35.0"
  use-sync-external-store: "1.4.0"
  utf-8-validate: "6.0.6"
  zod: ">=4.4.3"
  "ws@>=7.0.0 <8.0.0": ">=7.5.12"
  "ws@>=8.0.0": ">=8.21.1"
  esbuild: ">=0.25.0"
allowBuilds:
  "@opensea/seaport-js": false
  "@parcel/watcher": false
  "@reown/appkit": false
  "@stellar/stellar-sdk": false
  bigint-buffer: false
  "blake-hash": false
  bufferutil: false
  core-js: false
  esbuild: true
  keccak: false
  msgpackr-extract: false
  nx: true
  protobufjs: false
  "secp256k1": false
  sharp: false
  svelte-preprocess: false
  "tiny-secp256k1": false
  tsl-apple-cloudkit: false
  usb: false
  utf-8-validate: false
