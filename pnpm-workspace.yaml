packages:
  - "packages/*"
  - "examples/*"
  - "e2e"
# pnpm 12 applies a supply-chain release-age gate by default. Every entry below names
# one exact version allowed through it, so an entry dies with its version instead of
# exempting a package forever. Keep it that way: no bare package names except the
# first-party '@bigmi/*' and '@lifi/*' wildcards.
#
# pnpm rewrites this sequence on install and drops comments placed between the items,
# so the rationale has to live here, above the key:
#   - wagmi 3.7.7 carries @wagmi/core 3.6.5, which drops the viem tempo/zones import.
#     Kept so a gate cannot hold the tree below that line; these have since aged out.
#   - The 2026-09-10 dependency bump took React 19.3.0, the Vite/Biome toolchain, the
#     wallet SDKs (Privy, Dynamic, Mysten, Solana, Mesh) and happy-dom/react-router
#     deliberately while they were still inside the age window.
#   - '@biomejs/cli-*' and the other platform binaries are added by pnpm itself to
#     match the package that pulls them.
minimumReleaseAgeExclude:
  - '@bigmi/*'
  - '@lifi/*'
  - wagmi@3.7.7
  - '@wagmi/core@3.6.5'
  - '@wagmi/connectors@8.2.0'
  - '@creit.tech/stellar-wallets-kit@2.6.0'
  - react@19.3.0
  - react-dom@19.3.0
  - '@types/react@19.3.0'
  - '@types/react-dom@19.3.0'
  - vite@8.3.0
  - '@biomejs/biome@2.5.13'
  - '@privy-io/react-auth@3.42.0'
  - '@dynamic-labs/bitcoin@5.8.0'
  - '@dynamic-labs/ethereum@5.8.0'
  - '@dynamic-labs/ethereum-aa@5.8.0'
  - '@dynamic-labs/sdk-react-core@5.8.0'
  - '@dynamic-labs/solana@5.8.0'
  - '@dynamic-labs/solana-core@5.8.0'
  - '@dynamic-labs/wagmi-connector@5.8.0'
  - '@mysten/sui@2.30.0'
  - '@mysten/dapp-kit-react@2.1.26'
  - '@solana/wallet-adapter-base@0.9.28'
  - '@solana/wallet-adapter-react@0.15.40'
  - '@solana/wallet-standard-features@1.5.0'
  - '@meshconnect/web-link-sdk@3.13.0'
  - happy-dom@20.14.3
  - '@tanstack/react-router@1.170.34'
  - '@biomejs/cli-darwin-arm64@2.5.13'
  - '@biomejs/cli-darwin-x64@2.5.13'
