packages:
  - "packages/*"
  - "examples/*"
  - "e2e"
minimumReleaseAgeExclude:
  - "@bigmi/*"
  - "@lifi/*"
overrides:
  "@react-native-async-storage/async-storage": ">=2.2.0"
  # Exact pin, not a range: the stellar-wallets-kit tree drags in a second appkit
  # minor, and two appkit copies mean two AppKitNetwork type identities.
  "@reown/appkit": "1.8.23"
  "@reown/appkit>@walletconnect/universal-provider": ">=2.23.9"
  "@msgpack/msgpack": ">=3.1.3"
  abitype: ">=1.2.4"
  axios: "^1.16.0"
  viem: ">=2.52.0"
  bs58: ">=4.0.1"
  preact: ">=10.29.1"
  use-sync-external-store: "1.4.0"
  utf-8-validate: "6.0.6"
  zod: ">=4.4.3"
allowBuilds:
  "@opensea/seaport-js": false
  "@parcel/watcher": false
  "@reown/appkit": false
  "@stellar/stellar-sdk": false
  bigint-buffer: false
  "blake-hash": false
  bufferutil: false
  core-js: false
  esbuild: true
  keccak: false
  msgpackr-extract: false
  nx: true
  protobufjs: false
  "secp256k1": false
  sharp: false
  svelte-preprocess: false
  "tiny-secp256k1": false
  tsl-apple-cloudkit: false
  usb: false
  utf-8-validate: false
