name: 'PNPM install'
description: 'Run pnpm install (pnpm store cache on by default)'

inputs:
  cache:
    description: >-
      Use the pnpm store cache. Set "false" in privileged jobs (publish / version
      PR / preview) so a poisoned cache can't reach a context with publish/write perms.
    default: 'true'
  filters:
    description: >-
      Workspace package selectors, one per line; empty installs the full workspace.
      The install stops if a selector matches no workspace project.
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '26'
        registry-url: 'https://registry.npmjs.org'
        # '' disables caching entirely (no restore, no save) for privileged jobs.
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
    - name: Install dependencies
      env:
        HUSKY: '0' # By default do not run HUSKY install
        PNPM_FILTERS: ${{ inputs.filters }}
      shell: bash
      run: |
        filters=()
        # Plain `read` trims the spaces around each selector.
        while read -r filter; do
          if [[ -z "$filter" ]]; then
            continue
          fi
          # pnpm skips a selector that matches nothing and still exits 0, even
          # with --fail-if-no-match when another selector matches. Check each one.
          if ! pnpm --filter="$filter" --fail-if-no-match ls --depth=-1 > /dev/null; then
            echo "::error::No workspace project matches the pnpm filter '$filter'."
            exit 1
          fi
          filters+=("--filter=$filter")
        done <<< "$PNPM_FILTERS"
        pnpm "${filters[@]}" install --frozen-lockfile --prefer-offline
